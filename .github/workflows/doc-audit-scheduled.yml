name: Scheduled Documentation Audit

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC
  workflow_dispatch:       # Also allow manual triggering

jobs:
  scheduled-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt || true

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run full repo audit
        id: full_audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude --dangerously-skip-permissions \
                 --print \
                 "run tasks/parallel-doc-review.md" | tee audit_output.txt

      - name: Create JIRA ticket with findings
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          set -euo pipefail

          SUMMARY="docs: Weekly Documentation Audit — $(date -u +%Y-%m-%d)"

          PAYLOAD=$(jq -n \
            --arg summary "$SUMMARY" \
            --rawfile body audit_output.txt \
            '{
              fields: {
                project: { key: "TESTMCP" },
                issuetype: { name: "Task" },
                summary: $summary,
                description: {
                  type: "doc",
                  version: 1,
                  content: [
                    {
                      type: "codeBlock",
                      content: [
                        { type: "text", text: $body }
                      ]
                    }
                  ]
                }
              }
            }')

          RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST \
            -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "${JIRA_BASE_URL}/rest/api/3/issue")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "JIRA ticket creation failed (HTTP $HTTP_CODE)"
            echo "$RESPONSE_BODY"
            exit 1
          fi

          ISSUE_KEY=$(echo "$RESPONSE_BODY" | jq -r '.key')
          echo "Created JIRA ticket: ${JIRA_BASE_URL}/browse/${ISSUE_KEY}"